name: IMED SPORT CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3 # Versión fija más estable
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          connect_timeout: 40s
          # Anticipación al error de fingerprint
          debug: true
          script: |
            echo "🔍 Entrando al servidor..."
            cd /root/imed-sport-ecosystem/server || exit
            git pull origin main
            npm install
            npx prisma generate
            npx prisma db push --force-reset
            # Saneamiento de procesos con PM2
            pm2 restart imed-api || pm2 start index.js --name imed-api
            echo "✅ Despliegue exitoso."
